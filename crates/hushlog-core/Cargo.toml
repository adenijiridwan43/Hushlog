[package]
name = "hushlog-core"
description = "Pure pipeline core for hushlog: framing, normalization, fingerprinting, block detection and folding. No I/O, no clock, no process spawning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

# A library. Only the `hushlog` crate ships a binary, so this must not be
# published as a release archive.
[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
xxhash-rust.workspace = true
thiserror.workspace = true
# Pattern block markers declared by rule packs. Substring markers stay the
# fast path; this is only consulted when they miss.
regex.workspace = true

[dev-dependencies]
proptest = "1"
insta = "1"