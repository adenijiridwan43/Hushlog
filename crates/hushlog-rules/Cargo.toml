[package]
name = "hushlog-rules"
description = "TOML rule schema, loader and single-pass RegexSet classifier for hushlog, with built-in packs for cargo, npm, docker and kubectl."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# Resolved at package time, so crates.io shows the real README without
# duplicating it into four crate directories.
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

# A library. Only hushlog-cli ships a binary, so this must not be
# published as a release archive.
[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
hushlog-core.workspace = true
regex.workspace = true
aho-corasick.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta = "1"