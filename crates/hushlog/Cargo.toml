[package]
name = "hushlog"
description = "The hushlog binary: pipe and wrap modes, byte-exact --tee, and exit-code passthrough."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# Resolved at package time, so crates.io shows the real README without
# duplicating it into four crate directories.
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "hushlog"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hushlog-core.workspace = true
hushlog-rules.workspace = true
hushlog-render.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
portable-pty.workspace = true

[dev-dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
assert_cmd = "2"
predicates = "3"
insta = "1"
tempfile = "3"
