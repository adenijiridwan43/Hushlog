[package]
name = "hushlog-render"
description = "Renderers for hushlog: ANSI TTY, plain text, GitHub Actions folds, GitLab collapsible sections, and JSON for machine consumers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# Resolved at package time, so crates.io shows the real README without
# duplicating it into four crate directories.
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

# A library. Only the `hushlog` crate ships a binary, so this must not be
# published as a release archive.
[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
hushlog-core.workspace = true
anstream.workspace = true
owo-colors.workspace = true
is-terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta = "1"
proptest = "1"