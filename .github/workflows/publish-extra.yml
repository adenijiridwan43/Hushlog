# Jobs that cargo-dist cannot model, kept out of the generated release.yml.
#
# `release.yml` is owned by cargo-dist and regenerated by `dist init`; editing it
# by hand makes `dist plan` fail with "out of date contents". So the two extra
# publish channels live here instead, triggered once the GitHub Release that
# dist creates is published.
#
# Both jobs are idempotent, so re-running this workflow on an existing release
# is safe:
#   * the crates.io job skips a crate whose exact version is already live
#   * the Docker job just retags and repushes the image
name: Publish extra channels

on:
  release:
    # `published` fires for a stable release; `prereleased` fires for a
    # prerelease like v0.1.0-alpha.1. Both are needed: GitHub does not send
    # `published` for a prerelease, so listening only for `published` meant this
    # workflow never ran for the first release at all.
    types: [published, prereleased]
  # Lets the jobs be dry-run from the Actions tab without cutting a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (defaults to the latest release)"
        required: false

permissions:
  contents: read

jobs:
  # crates.io needs a dependency-ordered publish: a crate cannot be uploaded
  # before the crates it depends on are live. dist publishes in parallel, so
  # this ordering is hand-written.
  #
  # Set the CARGO_REGISTRY_TOKEN secret to enable it. Without the secret the job
  # skips, so binaries still ship from a repository that has not configured it.
  publish-crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check for the registry token
        id: token
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to crates.io, in dependency order
        if: ${{ steps.token.outputs.configured == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          # A version already on crates.io is skipped, not an error, so a
          # re-run of a partially-published release finishes the job.
          publish_if_new() {
            crate="$1"
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')
            if curl -fsS "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping."
            else
              echo "publishing ${crate} ${version}"
              cargo publish -p "$crate"
              # crates.io needs a moment before a new crate can be a dependency.
              sleep 30
            fi
          }
          publish_if_new hushlog-core
          publish_if_new hushlog-rules
          publish_if_new hushlog-render
          publish_if_new hushlog

  # The container image, pushed to GitHub Container Registry. This needs no
  # extra secret: the workflow's own GITHUB_TOKEN has packages:write.
  publish-docker:
    name: publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hushlog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
