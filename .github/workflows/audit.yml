name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught without a push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny (licences + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit (vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}